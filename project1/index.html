<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="flex flex-col md:flex-row min-h-screen">
      
    
        <div class="flex-1 relative max-w-4xl p-4 md:p-6 mx-auto">
      
          <h1 class="text-center text-3xl md:text-4xl font-bold mb-6 md:mb-8">
            DOM Array Method
          </h1>
      
          <div class="flex flex-col md:flex-row gap-6 md:gap-8">
      

            <div class="w-full md:w-1/3 flex flex-col gap-3 md:gap-4 border-r-0 md:border-r-2 border-gray-300 pr-0 md:pr-4">
      
              <button class="bg-blue-600 text-white py-2 rounded hover:bg-blue-700" id="add">
                Add User
              </button>
      
              <button class="bg-green-600 text-white py-2 rounded hover:bg-green-700" id="double">
                Double Money
              </button>
      
              <button class="bg-purple-600 text-white py-2 rounded hover:bg-purple-700" id="show">
                Show Only Millionaires
              </button>
      
              <button class="bg-orange-600 text-white py-2 rounded hover:bg-orange-700" id="richest">
                Sort by Richest
              </button>
      
              <button class="bg-red-600 text-white py-2 rounded hover:bg-red-700" id="wealth">
                Calculate Entire Wealth
              </button>
      
            </div>
      

            <div class="w-full md:w-2/3 p-4 md:p-6 rounded bg-gray-50" id="main">
           
            </div>
      
          </div>
      
        </div>
      
      
    </div>
      

    <script src="script.js"></script>
</body>

</html>
