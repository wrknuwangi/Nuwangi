<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics Search App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html { height: 100%; }
    .top-bg {
      background-image: url('p4.jpg'); /* Replace with your image */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 50vh;
      color: white;
    }
    #results { max-height: 45vh; overflow-y: auto; }
    pre { white-space: pre-wrap; }
    .row {
  display: flex;
}

.row > .col-md-6 {
  flex: 1; /* equal width columns */
  padding: 10px;
  box-sizing: border-box;
}

#lyrics {
  max-height: 45vh;
  overflow-y: auto;
  border-left: 1px solid #ccc;
  padding-left: 15px;
}

  </style>
</head>
<body>

<div class="container-fluid vh-100 d-flex flex-column">
  <!-- Top hero section -->
  <div class="row top-bg d-flex flex-column justify-content-center align-items-center text-center">
    <h1 class="mb-4">Lyrics Search</h1>
    <form class="d-flex gap-2 w-50" id="searchSong">
      <input type="search" id="searchInput" class="form-control" placeholder="Search by song or artist">
      <button type="submit" class="btn btn-primary">Search</button>
    </form>
  </div>

  <!-- Results section -->
  <div class="row">
    <!-- Left Column: Search + Results -->
    <div class="col-md-6">
      <div id="results"></div>
      <div id="more" class="mt-2"></div>
    </div>
  
    <!-- Right Column: Lyrics -->
    <div class="col-md-6" id="lyrics">
      <p class="text-muted">Lyrics will appear here...</p>
    </div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
