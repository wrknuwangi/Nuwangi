<html>

<head>
    <style>
        .form{
            margin-left: 600px;
            margin-right: 600px;
            margin-bottom: 10px;
        }
        .row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        label {
            width: 100px;
            /* same width for alignment */
            margin-right: 10px;
        }
    </style>

</head>

<body>
    <div class="form-container">
        <div class="form">
            <h1 style="background-color: rgb(194, 178, 250);">DEVELOPERS SERVAY FORM</h1>
            <h5 style="background-color: rgb(0, 0, 0); color: #fff;">Thank you for taking the time to help us know the about world wide developers</h5>

            <form style="background-color: rgb(4, 63, 55);">
                <div class="row">
                    <label>Name:</label>
                    <input type="text" placeholder="Name">
                </div>

                <div class="row">
                    <label>Email:</label>
                    <input type="email" placeholder="Email">
                </div>

                <div class="row">
                    <label>Age:</label>
                    <input type="number" placeholder="Age">
                </div>

                <div class="row">
                    <label>Nationality:</label>
                    <select>
                        <option>Indian</option>
                        <option>Sri Lankan</option>
                    </select>
                </div>

                <div class="row">
                    <label>Developer:</label>
                    <label>
                        <input type="radio" name="Front-End"> Front-End
                    </label>
                    <label>
                        <input type="radio" name="Back-End"> Back-End
                    </label>
                    <label>
                        <input type="radio" name="Fullstack"> Fullstack
                    </label>
                </div>

                <div class="row">
                    <label>Qualification:</label>
                    <label>
                        <input type="checkbox" name="10+2"> 10+2
                    </label>
                    <label>
                        <input type="checkbox" name="Graduation"> Graduation
                    </label>
                    <label>
                        <input type="checkbox" name="Degree"> Degree
                    </label>
                </div>

                <div class="row">
                    <label>Describe about you:</label>
                    <textarea rows="4"></textarea>
                </div>
            </form>
        </div>

    </div>
</body>

</html>
